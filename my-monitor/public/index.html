<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мониторинг датчиков GPS (Индия + соседи)</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f0f2f5; }
    #map { height:100vh; width:100%; background:#e5e9f0; }
    .info-panel {
      position:absolute; top:20px; right:20px;
      background:rgba(255,255,255,0.95);
      padding:15px 20px; border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
      z-index:1000; max-height:80vh; overflow-y:auto;
      min-width:240px; backdrop-filter:blur(4px);
    }
    .info-panel h3 { margin:0 0 8px 0; font-size:18px; border-bottom:2px solid #ddd; padding-bottom:6px; }
    .country-selector { margin:8px 0 12px 0; font-size:13px; }
    .country-selector label { display:inline-block; margin-right:10px; cursor:pointer; }
    .country-selector input[type="checkbox"] { margin-right:4px; }
    .btn-group { display:flex; gap:8px; margin:8px 0 12px 0; flex-wrap:wrap; }
    .btn-group button { flex:1; padding:8px 10px; border:none; border-radius:8px; font-weight:600; font-size:13px; cursor:pointer; transition:0.2s; }
    .btn-cold { background:#3498db; color:#fff; }
    .btn-cold:hover { background:#2980b9; }
    .btn-hot { background:#e74c3c; color:#fff; }
    .btn-hot:hover { background:#c0392b; }
    .sensor-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f0f0f0; font-size:14px; }
    .sensor-item:last-child { border:none; }
    .sensor-name { font-weight:500; }
    .temp { font-weight:bold; padding:2px 8px; border-radius:12px; background:#f5f5f5; }
    .temp.hot { color:#d9534f; background:#fde8e8; }
    .temp.cold { color:#337ab7; background:#e3f0fa; }
    .temp.normal { color:#5cb85c; background:#e6f7e6; }
    .timestamp { font-size:11px; color:#999; margin-left:10px; }
    .error-msg { color:#a94442; background:#f2dede; padding:10px; border-radius:6px; text-align:center; }
    .debug-info { margin-top:8px; font-size:11px; color:#555; background:#f8f9fa; padding:6px; border-radius:6px; border:1px solid #ddd; max-height:80px; overflow:auto; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info-panel" id="infoPanel">
    <h3>📡 Датчики (Индия + соседи)</h3>
    <div class="country-selector" id="countrySelector">
      <label><input type="checkbox" value="IN" checked> Индия</label>
      <label><input type="checkbox" value="PK" checked> Пакистан</label>
      <label><input type="checkbox" value="BD" checked> Бангладеш</label>
      <label><input type="checkbox" value="NP" checked> Непал</label>
      <label><input type="checkbox" value="LK"> Шри-Ланка</label>
    </div>
    <div class="btn-group">
      <button class="btn-cold" id="btnCold">❄️ Самое холодное</button>
      <button class="btn-hot" id="btnHot">🔥 Самое тёплое</button>
    </div>
    <div id="sensorList">Загрузка данных...</div>
    <div id="debugInfo" class="debug-info">⏳ Ожидание ответа сервера...</div>
    <div style="margin-top:8px; font-size:11px; color:#888; border-top:1px solid #eee; padding-top:6px;">
      ⏱️ Обновление: 1 минута
    </div>
  </div>

  <script>
    // ============================================================
    // КОНФИГУРАЦИЯ – теперь запрос идёт к своему серверу
    // ============================================================
    const API_URL = '/api/sensors';   // Тот же хост, без CORS
    const REFRESH_INTERVAL = 60000;

    // ============================================================
    // КАРТА
    // ============================================================
    const map = L.map('map', {
      center: [22, 80],
      zoom: 5,
      minZoom: 4,
      maxZoom: 12,
      maxBounds: [ [5, 65], [35, 95] ],
      maxBoundsViscosity: 1.0
    });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // ============================================================
    // ГЕОДАННЫЕ СТРАН
    // ============================================================
    let allCountriesGeoJSON = null;
    let countryLayers = {};

    async function loadAllCountries() {
      try {
        const resp = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
        if (!resp.ok) throw new Error('Геоданные не загружены');
        const topology = await resp.json();
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/topojson-client@3';
        script.onload = () => {
          const countries = topojson.feature(topology, topology.objects.countries);
          allCountriesGeoJSON = countries;
          updateCountryVisibility();
          fetchSensors();
          setInterval(fetchSensors, REFRESH_INTERVAL);
        };
        document.head.appendChild(script);
      } catch (err) {
        console.error('Ошибка загрузки геоданных:', err);
        fetchSensors();
        setInterval(fetchSensors, REFRESH_INTERVAL);
      }
    }

    function updateCountryVisibility() {
      if (!allCountriesGeoJSON) return;
      for (const id in countryLayers) {
        map.removeLayer(countryLayers[id]);
        delete countryLayers[id];
      }
      const checkboxes = document.querySelectorAll('#countrySelector input[type="checkbox"]');
      const selected = [];
      checkboxes.forEach(cb => { if (cb.checked) selected.push(cb.value); });
      const features = allCountriesGeoJSON.features.filter(f => selected.includes(f.id));
      features.forEach(f => {
        const layer = L.geoJSON(f, {
          style: { fillColor: 'rgba(200,220,240,0.4)', fillOpacity: 0.5, color: '#2c3e50', weight: 2 },
          onEachFeature: (feat, l) => l.bindPopup(`<b>${feat.properties.name}</b>`)
        }).addTo(map);
        countryLayers[f.id] = layer;
      });
    }
    document.getElementById('countrySelector').addEventListener('change', updateCountryVisibility);

    // ============================================================
    // ДАННЫЕ ДАТЧИКОВ – ЗАПРОС К СВОЕМУ СЕРВЕРУ
    // ============================================================
    let sensorsData = [];
    const markers = {};

    function extractSensorsArray(data) {
      if (Array.isArray(data)) return data;
      if (data && typeof data === 'object') {
        if (Array.isArray(data.data)) return data.data;
        if (Array.isArray(data.sensors)) return data.sensors;
        if (Array.isArray(data.items)) return data.items;
        if (data.id && data.lat !== undefined) return [data];
      }
      return null;
    }

    function normalizeSensors(sensors) {
      return sensors.map(s => ({
        id: s.id || s.sensor_id || s.device_id || String(Math.random()),
        name: s.name || s.label || s.location || 'Датчик',
        lat: parseFloat(s.lat || s.latitude || s.latitud || 0),
        lng: parseFloat(s.lng || s.lon || s.longitude || s.long || 0),
        temperature: parseFloat(s.temperature || s.temp || s.value || 0),
        timestamp: parseInt(s.timestamp || s.time || s.ts || Date.now())
      })).filter(s => !isNaN(s.lat) && !isNaN(s.lng) && s.lat !== 0 && s.lng !== 0);
    }

    function applySensors(sensors) {
      sensorsData = sensors;
      updateMap(sensorsData);
      updateList(sensorsData);
      document.getElementById('debugInfo').textContent = `✅ Загружено ${sensorsData.length} датчиков с сервера`;
      console.log('✅ Датчики применены:', sensorsData);
    }

    async function fetchSensors() {
      const debugEl = document.getElementById('debugInfo');
      debugEl.textContent = '⏳ Запрос к своему серверу...';
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const rawData = await response.json();
        console.log('📦 Сырые данные с сервера:', rawData);
        debugEl.textContent = '📦 Получены данные, анализ...';

        let sensors = extractSensorsArray(rawData);
        if (!sensors) throw new Error('Не удалось распознать массив датчиков');
        if (!Array.isArray(sensors) || sensors.length === 0) throw new Error('Массив датчиков пуст');
        sensors = normalizeSensors(sensors);
        if (sensors.length === 0) throw new Error('После нормализации данных нет');
        applySensors(sensors);
      } catch (err) {
        console.error('❌ Ошибка получения/обработки данных:', err);
        sensorsData = [];
        updateMap([]);
        updateList([]);
        debugEl.textContent = `❌ Ошибка: ${err.message}`;
        document.getElementById('sensorList').innerHTML =
          `<div class="error-msg">⚠️ Не удалось получить данные с сервера. Проверь подключение.</div>`;
      }
    }

    // ============================================================
    // ОБНОВЛЕНИЕ КАРТЫ И СПИСКА
    // ============================================================
    function updateMap(sensors) {
      const newIds = new Set(sensors.map(s => s.id));
      for (const id in markers) {
        if (!newIds.has(id)) {
          map.removeLayer(markers[id]);
          delete markers[id];
        }
      }
      sensors.forEach(sensor => {
        const { id, lat, lng, temperature, name, timestamp } = sensor;
        let color = 'green', tempClass = 'normal';
        if (temperature > 30) { color = 'red'; tempClass = 'hot'; }
        else if (temperature < 0) { color = 'blue'; tempClass = 'cold'; }

        const popupContent = `
          <b>${name || 'Датчик ' + id}</b><br>
          🌡️ <span class="temp ${tempClass}">${temperature.toFixed(1)} °C</span><br>
          🕒 ${new Date(timestamp).toLocaleString()}
        `;
        const icon = L.divIcon({
          className: 'custom-div-icon',
          html: `<div style="background-color:${color}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 8px rgba(0,0,0,0.7);"></div>`,
          iconSize: [16,16], iconAnchor: [8,8]
        });

        if (markers[id]) {
          markers[id].setPopupContent(popupContent);
          markers[id].setIcon(icon);
        } else {
          const marker = L.marker([lat, lng], { icon }).addTo(map);
          marker.bindPopup(popupContent);
          markers[id] = marker;
        }
      });
    }

    function updateList(sensors) {
      const list = document.getElementById('sensorList');
      if (!sensors || sensors.length === 0) {
        list.innerHTML = '<div style="color:#888;">Нет активных датчиков</div>';
        return;
      }
      let html = '';
      sensors.forEach(s => {
        let tc = 'normal';
        if (s.temperature > 30) tc = 'hot';
        else if (s.temperature < 0) tc = 'cold';
        html += `
          <div class="sensor-item">
            <span class="sensor-name">${s.name || 'Датчик ' + s.id}</span>
            <span>
              <span class="temp ${tc}">${s.temperature.toFixed(1)}°</span>
              <span class="timestamp">${new Date(s.timestamp).toLocaleTimeString()}</span>
            </span>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    // ============================================================
    // КНОПКИ ЭКСТРЕМУМОВ
    // ============================================================
    function findExtreme(type) {
      if (!sensorsData || sensorsData.length === 0) {
        alert('Нет данных датчиков');
        return;
      }
      const target = type === 'cold'
        ? sensorsData.reduce((a, b) => a.temperature < b.temperature ? a : b)
        : sensorsData.reduce((a, b) => a.temperature > b.temperature ? a : b);
      if (!target) return;
      map.setView([target.lat, target.lng], 11);
      const marker = markers[target.id];
      if (marker) marker.openPopup();
    }
    document.getElementById('btnCold').addEventListener('click', () => findExtreme('cold'));
    document.getElementById('btnHot').addEventListener('click', () => findExtreme('hot'));

    // ============================================================
    // ЗАПУСК
    // ============================================================
    loadAllCountries();
  </script>
</body>
</html>
